<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>OGM Viewer Preview</title>

    <link rel="shortcut icon" href="./build/assets/favicon.ico" />
    <script type="module" src="./build/ogm-viewer.esm.js"></script>
    <script nomodule src="./build/ogm-viewer.js"></script>

    <style>
      body {
        margin: 0;
        padding: 1rem;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin: 1rem auto;
      }

      #recordUrl {
        max-width: 400px;
      }

      .record-input,
      .props {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        align-items: center;
        margin-bottom: 1rem;
      }

      .record-selector select {
        min-width: 420px;
        max-width: min(90vw, 800px);
      }

      ogm-viewer,
      ogm-overview {
        display: block;
        height: 500px;
        flex: auto;
        width: min(90vw, 800px);
        flex: none;
        border: 1px solid #ccc;
      }
    </style>

    <script type="module">
      import { OgmRecord } from './build/index.esm.js';

      function parseCsvRecords(csvText) {
        const rows = [];
        let currentRow = [];
        let currentValue = '';
        let inQuotes = false;

        for (let i = 0; i < csvText.length; i += 1) {
          const char = csvText[i];

          if (char === '"') {
            if (inQuotes && csvText[i + 1] === '"') {
              currentValue += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            currentRow.push(currentValue);
            currentValue = '';
          } else if ((char === '\n' || char === '\r') && !inQuotes) {
            currentRow.push(currentValue);
            if (currentRow.some(value => value !== '')) {
              rows.push(currentRow);
            }
            currentRow = [];
            currentValue = '';
            if (char === '\r' && csvText[i + 1] === '\n') {
              i += 1;
            }
          } else {
            currentValue += char;
          }
        }

        if (currentValue.length || currentRow.length) {
          currentRow.push(currentValue);
          if (currentRow.some(value => value !== '')) {
            rows.push(currentRow);
          }
        }

        if (!rows.length) return [];

        const [headerRow, ...dataRows] = rows;
        const headers = headerRow.map(header => header.trim());

        return dataRows.map(values => {
          const record = {};
          headers.forEach((header, index) => {
            record[header] = (values[index] ?? '').trim();
          });
          return record;
        });
      }

      async function populateRecordSelector(select) {
        const recordsUrl = new URL('/build/assets/records.csv', window.location.href).href;
        const response = await fetch(recordsUrl);
        if (!response.ok) throw new Error(`Unable to load records CSV: ${response.status}`);

        const csvText = await response.text();
        const records = parseCsvRecords(csvText).filter(record => record.label && record.url);

        select.innerHTML = '';

        const emptyOption = document.createElement('option');
        emptyOption.value = '';
        emptyOption.textContent = 'Select record(s)';
        select.appendChild(emptyOption);

        records.forEach(record => {
          const option = document.createElement('option');
          option.value = record.url;
          option.textContent = record.label;
          select.appendChild(option);
        });
      }

      // Set up controls
      document.addEventListener('DOMContentLoaded', async () => {
        const recordSelector = document.getElementById('recordSelector');
        const viewer = document.querySelector('ogm-viewer');
        const overview = document.querySelector('ogm-overview');
        const recordInput = document.getElementById('recordUrl');
        const loadRecordButton = document.getElementById('loadRecord');
        const switchOverviewButton = document.getElementById('switch-overview');
        const switchViewerButton = document.getElementById('switch-viewer');
        const hideTitle = document.querySelector('.hideTitle')

        switchOverviewButton.addEventListener('click', () => {
          overview.style.display = 'flex';
          viewer.style.display = 'none';
          switchOverviewButton.style.display = 'none';
          switchViewerButton.style.display = 'inline-block';
          hideTitle.style.display = 'none';
        });

        switchViewerButton.addEventListener('click', () => {
          overview.style.display = 'none';
          viewer.style.display = 'block';
          switchOverviewButton.style.display = 'inline-block';
          switchViewerButton.style.display = 'none';
          hideTitle.style.display = 'inline-block';
        });

        // Dynamically populate the selector
        try {
          await populateRecordSelector(recordSelector);
        } catch (error) {
          console.error(error);
          recordSelector.innerHTML = '<option value="">Unable to load records</option>';
        }

        // Load record button
        loadRecordButton.addEventListener('click', async () => {
          const recordUrl = recordInput.value.trim() || recordSelector.value;
          const recordContents = await fetch(recordUrl);
          const recordJson = await recordContents.json();
          const record = new OgmRecord(recordJson);

          if (recordUrl) viewer.recordUrl = recordUrl;
          if (record) overview.records = [record];
        });

        // Toggle theme button
        const toggleThemeButton = document.getElementById('toggleTheme');
        toggleThemeButton.addEventListener('click', () => {
          const theme = viewer.theme === 'light' ? 'dark' : 'light';
          viewer.theme = theme;
          overview.theme = theme;
        });

        // Hide title checkbox
        const hideTitleCheckbox = document.getElementById('hideTitle');
        hideTitleCheckbox.addEventListener('change', () => {
          viewer.hideTitle = hideTitleCheckbox.checked;
        });
      });
    </script>
  </head>
  <body>
    <h1>OpenGeoMetadata Viewer Preview</h1>
    <div class="inputs">
      <div class="record-input">
        <div class="record-selector">
          <select id="recordSelector" aria-label="Select a record to view"></select>
        </div>
        <span>or</span>
        <input type="text" id="recordUrl" size="80" placeholder="Enter an OpenGeoMetadata record URL" />
        <button id="loadRecord">Load</button>
      </div>
      <div class="props">
        <button id="toggleTheme">Toggle Theme</button>
        <button id="switch-overview">Switch to overview</button>
        <button id="switch-viewer" style="display: none">Switch to viewer</button>
        <label class="hideTitle">Hide Title <input type="checkbox" id="hideTitle" /></label>
      </div>
    </div>

    <ogm-viewer></ogm-viewer>
    <ogm-overview style="display:none;"></ogm-overview>
  </body>
</html>
