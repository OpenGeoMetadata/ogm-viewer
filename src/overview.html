<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>OGM Overview</title>

    <link rel="shortcut icon" href="./build/assets/favicon.ico" />
    <script type="module" src="./build/ogm-viewer.esm.js"></script>
    <script nomodule src="./build/ogm-viewer.js"></script>

    <style>
      body {
        margin: 0;
        padding: 1rem;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        margin: 1rem auto;
      }

      .inputs {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin: 1rem;
        max-width: 1000px;
      }

      ogm-overview {
        display: block;
        aspect-ratio: 1;
        width: 500px;
        height: 500px;
        flex: none;
        border: 1px solid #ccc;
      }

      .search {
        max-width: 1000px;
        display: flex;
        gap: 1rem;
        justify-content: center;
        align-items: flex-start;
      }

      .results {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .record-title {
        padding: 0.5rem 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>OpenGeoMetadata overview</h1>
    <div class="inputs">
      <div class="record-selector">
        <label for="recordSelector">Select records:</label>
        <select id="recordSelector" aria-label="Select record to view" multiple>
          <option value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.berkeley/02b742b5d7ea01aa77bad37a4429951164b34eab/metadata-aardvark/s7sq63/geoblacklight.json">
            Calaveras Contours (Line, WMS)
          </option>
          <option value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.berkeley/02b742b5d7ea01aa77bad37a4429951164b34eab/metadata-aardvark/s7st30/geoblacklight.json">
            Calaveras Tracts (Polygon, WMS)
          </option>
          <option
            value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/b0f8e0f854949f297d83c11598b7fb0669b50c6e/spec/fixtures/solr_documents/cornell_html_metadata.json"
          >
            Air Stations (Points, WMS)
          </option>
          <option value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.berkeley/02b742b5d7ea01aa77bad37a4429951164b34eab/metadata-aardvark/s7042k/geoblacklight.json">
            Bangladesh Topo (Raster, WMS, Restricted)
          </option>
          <option value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/refs/heads/main/spec/fixtures/solr_documents/public_cog_princeton.json">
            Tibet (Scanned Map, COG)
          </option>
          <option
            value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.utexas/2540a551f4f8d32fb4599e3baa0625cb40a88b21/metadata-aardvark/utlmaps-5b6ad9fb-2635-4622-b539-4b59b6ac9322.json"
          >
            Sanborn (Scanned Map, COG)
          </option>
          <option
            value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/3ff40cc2da1f67d671625c78c581457772eb706b/spec/fixtures/solr_documents/public_pmtiles_princeton.json"
          >
            Louisiana Districts (PMTiles, Vector)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/4cf4bbf98cb02f5198592a8aed2bad3f/raw/b0f2406b07c50d7537330791cd52443b151194e7/farmland.json">
            Farmland (PMTiles, Vector)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/b237fb412b71cc2b8352c4c5067f1f22/raw/4dae9352501d93e93b1a93f9cb2dae37bc8bec27/flower.json">
            Flowers (PMTiles, Raster)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/2be84fa59dbf5e5b85b237903f80d18b/raw/b6ff324e6bab2cfc65af1159939c6a1cbec490a5/tilejson">
            Countries Demo (Vector TileJSON)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/2be84fa59dbf5e5b85b237903f80d18b/raw/fb8f6e416af087a7a5c2a84094a0cfc421d8f41c/tilejson-raster">
            Tibet (Raster TileJSON over COG)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/d75a2a5916328be3f1597cab89fa79b4/raw/aad202cf8a31dca8c803191902d493b5edc50e7d/cog.json">
            Stanford Farm (EPSG:4326 COG)
          </option>
          <option value="./build/assets/records/restricted-cog.json">Finland 2G Coverage (COG, Restricted)</option>
          <option value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/9f7dbb4c36dc0b8e88fb9be5282d7b1663858829/spec/fixtures/solr_documents/tms.json">
            Ag Districts (TMS)
          </option>
          <option value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/9f7dbb4c36dc0b8e88fb9be5282d7b1663858829/spec/fixtures/solr_documents/xyz.json">
            Faults (XYZ Tiles)
          </option>
          <option value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/refs/heads/main/spec/fixtures/solr_documents/wmts-multiple.json">
            Wien Orthophoto (WMTS)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/e04997a394ae14e0ddf1b3ed972d262a/raw/89a833fdae67872e00889f1a77e29a04fa44fdf9/night_lights.json">
            Night Lights (WMTS)
          </option>
          <option value="./build/assets/records/esri-dynamic-map-layer.json">Glacial Boundaries (ESRI Dynamic Map Layer, ESRI WMS)</option>
          <option value="./build/assets/records/esri-dynamic-map-layer-single.json">Glacial Boundaries (ESRI Dynamic Map Layer, Single Layer)</option>
          <option value="./build/assets/records/esri-tiled-map-layer.json">Land Cover (ESRI Tiled Map Layer)</option>
          <option value="./build/assets/records/esri-image-map-layer.json">NAIP Imagery (ESRI Image Map Layer)</option>
          <option value="./build/assets/records/esri-feature-layer.json">Landscape Trees (ESRI Feature Layer, Points)</option>
          <option
            value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.stanford.purl/b74664cbb36fb985fe2ebee8d0d6d9657f06ada1/metadata-aardvark/rv/900/sk/6861/geoblacklight.json"
          >
            Neighborhoods (Polygons, GeoJSON)
          </option>
          <option
            value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.stanford.purl/b74664cbb36fb985fe2ebee8d0d6d9657f06ada1/metadata-aardvark/qp/917/dm/2243/geoblacklight.json"
          >
            Temperature (Points, GeoJSON)
          </option>
          <option
            value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.stanford.purl/b74664cbb36fb985fe2ebee8d0d6d9657f06ada1/metadata-aardvark/zy/089/tj/2215/geoblacklight.json"
          >
            Peatland (Index Map, Polygons)
          </option>
          <option
            value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/be395f5d12a75c7f643baf550ace66efd387f602/spec/fixtures/solr_documents/index-map-v1-complex.json"
          >
            Millionth Map (Index Map, Overlapping Polygons)
          </option>
          <option
            value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.stanford.purl/3b796c5f3af45c136d25e076d5a3cfe8e401cac7/metadata-aardvark/zz/075/gp/2099/geoblacklight.json"
          >
            Dalian (Index Map, Polygons, Mixed Availability)
          </option>
          <option value="https://gist.githubusercontent.com/thatbudakguy/dcf881807aea33739a8cbb8fcefa42d0/raw/67b80876bdd17c21d654024bc77a1e4ece8a7fb6/hopkins.json">
            Hopkins (Index Map, Points)
          </option>
          <option value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/9f7dbb4c36dc0b8e88fb9be5282d7b1663858829/spec/fixtures/solr_documents/complex-geom.json">
            Isles (IIIF v2 Manifest, Complex Geometry)
          </option>
          <option
            value="https://raw.githubusercontent.com/OpenGeoMetadata/edu.stanford.purl/6fcf965ba970ecdb7f3bf4084e044acac368c359/metadata-aardvark/hj/948/rn/6493/geoblacklight.json"
          >
            Siberia (IIIF v3 Manifest, Multi-image)
          </option>
          <option value="https://raw.githubusercontent.com/geoblacklight/geoblacklight/refs/heads/main/spec/fixtures/solr_documents/public_iiif_princeton.json">
            NY &amp; NJ (IIIF Image)
          </option>
          <option value="./build/assets/records/georeferenced-manifest.json">NW Europe (Georeferenced IIIF Manifest, Image + Map)</option>
          <option value="./build/assets/records/download-only.json">Nepal (Nothing Previewable, Location Only)</option>
        </select>
        <button id="clear">Clear selection</button>
      </div>
      <div class="props">
        <button id="toggleTheme">Toggle Theme</button>
      </div>
      <a href="./index.html">Back to viewer</a>
    </div>

    <div class="search">
      <ogm-overview></ogm-overview>
      <div class="results">
        <h2>Records (try hovering)</h2>
        <ol class="record-list"></ol>
      </div>
    </div>

    <script type="module">
      import { OgmRecord } from './build/index.esm.js';

      // Set up controls
      document.addEventListener('DOMContentLoaded', async () => {
        await customElements.whenDefined('ogm-overview');
        const overview = document.querySelector('ogm-overview');
        const recordSelector = document.getElementById('recordSelector');
        const clearButton = document.getElementById('clear');
        const resultsArea = document.querySelector('.record-list');

        // When new records are selected, add them to the overview
        recordSelector.addEventListener('change', async () => {
          const selectedValues = Array.from(recordSelector.selectedOptions)
            .map(option => option.value)
            .filter(value => value);
          const fetchedRecords = await Promise.all(selectedValues.map(value => fetch(value).then(res => res.json())));
          const parsedRecords = fetchedRecords.map(data => new OgmRecord(data));
          overview.records = parsedRecords;
          resultsArea.innerHTML = parsedRecords.map((rec, index) => `<li class="record-title">${rec.title}</li>`).join('');
        });

        // Toggle theme button
        const toggleThemeButton = document.getElementById('toggleTheme');
        toggleThemeButton.addEventListener('click', () => {
          const theme = overview.theme === 'light' ? 'dark' : 'light';
          overview.theme = theme;
        });

        // Clear selection button
        clearButton.addEventListener('click', () => {
          recordSelector.selectedIndex = -1;
          overview.records = [];
        });
      });
    </script>
  </body>
</html>
